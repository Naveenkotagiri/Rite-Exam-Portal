# Local development database (port 5440 avoids clashing with other Postgres instances on this machine).
# The "app" service runs the production image against it:  docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    container_name: exam-portal-db
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - exam-portal-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    container_name: exam-portal-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://exam:exam@db:5432/exam
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:3400:3000"

volumes:
  exam-portal-db:
