# Rite Exam Portal site for the nginx container (network: bridge).
#   Website files: /usr/share/nginx/html/Examport   (the html/ folder of this package)
#   API:           the backend service on the server, reached from the container at 172.17.0.1:8085
# Copy to /etc/nginx/conf.d/rite-exam-portal.conf in the container; see README.md.

server {
    listen 80;
    server_name campus-hire.rite.digital;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name campus-hire.rite.digital;

    # Certificate paths INSIDE the nginx container
    ssl_certificate     /etc/pki/tls/certs/generic.rite.digital.crt;
    ssl_certificate_key /etc/pki/tls/certs/generic.rite.digital.key;

    client_max_body_size 12m;          # Excel question uploads (up to 10 MB)
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Frontend: static files ----
    root /usr/share/nginx/html/Examport;

    # JS, CSS and fonts carry a version in their file name: browsers may keep them for a year
    location /assets/ { include /etc/nginx/rite-exam-portal-headers.inc; expires 1y; try_files $uri =404; }
    location /brand/  { include /etc/nginx/rite-exam-portal-headers.inc; expires 1h; try_files $uri =404; }
    # Every page (/, /admin, /d/<code> ...) is index.html; the app shows the right screen. Never cached.
    location /        { include /etc/nginx/rite-exam-portal-headers.inc; expires -1; try_files $uri /index.html; }

    # ---- Backend: API ----
    location /api/ {
        proxy_pass http://172.17.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
