[project]
name = "rite-exam-portal-backend"
version = "2.0.0"
description = "Rite Exam Portal API: student registration, proctored online tests, marking and results."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "alembic>=1.16",
  "pydantic-settings>=2.9",
  "pyjwt>=2.10",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "httpx>=0.28", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, so tests can share pooled database connections.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the alembic/ folder holds our migrations, not the library
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses calls in default arguments by design.
extend-immutable-calls = ["fastapi.Depends"]
