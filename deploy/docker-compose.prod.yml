# Production stack for one Linux server (e.g. an OCI Compute VM).
# Settings come from deploy/.env (copy .env.prod.example). Run from this folder.
#
#   Server already has nginx on 80/443 (see deploy/nginx/rite-exam-portal.conf):
#     docker compose -f docker-compose.prod.yml up -d --build
#     → the app listens on 127.0.0.1:${APP_PORT} (default 8085) and nginx forwards the portal's domain to it
#
#   Server with nothing on 80/443: let Caddy handle HTTPS instead of nginx:
#     docker compose -f docker-compose.prod.yml --profile caddy up -d --build
#
#   Add --profile local-db to run PostgreSQL in a container here (when DATABASE_URL is not set).
#
# The containers use the server's own network (network_mode: host), so a PostgreSQL running on this
# same server is reached at 127.0.0.1 without opening any firewall port.
services:
  app:
    build: ..
    image: rite-exam-portal:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
        required: false  # only when the local-db profile is used
    environment:
      # Only this server can reach it (nginx); it is not open to the internet.
      HOST: 127.0.0.1
      PORT: ${APP_PORT:-8085}
      DATABASE_URL: ${DATABASE_URL:-postgres://exam:${DB_PASSWORD:-}@127.0.0.1:5433/exam}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host  # listens on ports 80 and 443 of this server
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-}
      APP_PORT: ${APP_PORT:-8085}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: exam
    ports:
      # 5433, so it never clashes with a PostgreSQL already installed on this server
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 10s
      retries: 10

volumes:
  db-data:
  caddy-data:
  caddy-config:
