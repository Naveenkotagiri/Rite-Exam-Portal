# Production stack for one Linux server (e.g. an OCI Compute VM):
#   Caddy (HTTPS on 80/443) → app (FastAPI + website) → PostgreSQL
# Settings come from deploy/.env (copy .env.prod.example). Run from this folder:
#
#   Your own PostgreSQL server (DATABASE_URL set in .env):
#     docker compose -f docker-compose.prod.yml up -d --build
#
#   Or a PostgreSQL container on this server (DB_PASSWORD set in .env, DATABASE_URL left empty):
#     docker compose -f docker-compose.prod.yml --profile local-db up -d --build
services:
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: exam
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 10s
      retries: 10

  app:
    build: ..
    image: rite-exam-portal:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false  # only when the local-db profile is used
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://exam:${DB_PASSWORD:-}@db:5432/exam}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
