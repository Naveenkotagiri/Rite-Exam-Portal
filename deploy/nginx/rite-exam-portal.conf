# nginx site for the Rite Exam Portal. The portal app listens on 127.0.0.1:8085 (APP_PORT in deploy/.env).
#
# 1. Copy to the server's nginx sites (path depends on the server):
#      Oracle Linux / RHEL:  /etc/nginx/conf.d/rite-exam-portal.conf
#      Ubuntu:               /etc/nginx/sites-available/rite-exam-portal.conf  (+ symlink in sites-enabled)
# 2. Replace exam.example.com (3 places) with the portal's domain.
# 3. Set the certificate paths: a Let's Encrypt certificate (sudo certbot --nginx -d <domain>)
#    or the certificate files from Rite IT.
# 4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name exam.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name exam.example.com;

    ssl_certificate     /etc/letsencrypt/live/exam.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exam.example.com/privkey.pem;

    # Excel question uploads can be up to 10 MB
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
