# nginx site for the Rite Exam Portal. The portal app listens on 127.0.0.1:8085 (PORT in deploy/.env).
# See DEPLOY.md, Step 7.
#
# 1. Copy to /etc/nginx/conf.d/rite-exam-portal.conf
# 2. Replace exam.example.com (3 places) with the portal's domain.
# 3. Set the certificate paths (Rite IT certificate, or Let's Encrypt via "certbot certonly").
# 4. sudo nginx -t && sudo systemctl reload nginx
#
# Do not add security headers (HSTS, CSP, X-Frame-Options ...) here: the portal already sends them.

server {
    listen 80;
    server_name exam.example.com;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" works on every nginx version (the newer "http2 on;" needs nginx 1.25.1+).
    # nginx 1.25.1+ prints a "deprecated" warning for it; that is harmless.
    listen 443 ssl http2;
    server_name exam.example.com;

    ssl_certificate     /etc/letsencrypt/live/exam.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exam.example.com/privkey.pem;

    # Excel question uploads can be up to 10 MB
    client_max_body_size 12m;

    # The portal does not compress its responses; nginx does.
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
